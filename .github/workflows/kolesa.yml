name: Kolesa Monitor

on:
  schedule:
    - cron: '*/20 * * * *' # Запуск каждые 20 минут
  workflow_dispatch: # Позволяет запустить вручную

jobs:
  run-parser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Разрешаем гитхабу сохранять файл истории
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright aiogram
          playwright install chromium
          playwright install-deps

      - name: Run script
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py

    - name: Save history
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          # Создаем файл, если он вдруг исчез
          touch seen_ads.txt 
          git add seen_ads.txt
          # Коммитим только если есть реальные изменения, чтобы не было ошибок
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update history" && git push)